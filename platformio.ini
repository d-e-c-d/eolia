; Projet Eolia : compilation avec PlatformIO (pio run) ou avec l'IDE Arduino (ouvrir firmware/eolia/eolia.ino)
[platformio]
src_dir = firmware/eolia

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    arduino-libraries/LiquidCrystal@^1.0.7
